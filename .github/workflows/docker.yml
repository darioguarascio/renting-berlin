name: Docker

on:
  push:
    branches: [main, master, dev]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.notes.outputs.version }}
      changed: ${{ steps.notes.outputs.changed }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute version and release notes
        id: notes
        env:
          SITE_URL: https://renting.berlin
        run: bash scripts/release-notes.sh

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.txt
          if-no-files-found: ignore

  build-web:
    needs: [test, version]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: darioguarascio/renting.berlin
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
            APP_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  build-workers:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: darioguarascio/renting.berlin-workers
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: ./workers
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=workers
          cache-to: type=gha,mode=max,scope=workers

  deploy:
    needs: [build-web, build-workers]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - uses: actions/checkout@v5

      - name: Sync compose file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: deploy/docker-compose.server.yml
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1
          overwrite: true

      - name: Install compose file
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            mv -f docker-compose.server.yml docker-compose.yml

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            export PATH="${HOME}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH:-}"
            export DOCKER_IMAGE_TAG=dev
            cd "${{ secrets.DEPLOY_PATH }}"

            compose() {
              if [ -x "${HOME}/bin/docker-compose" ]; then
                "${HOME}/bin/docker-compose" "$@"
              elif command -v docker-compose >/dev/null 2>&1; then
                docker-compose "$@"
              elif docker compose version >/dev/null 2>&1; then
                docker compose "$@"
              else
                echo "docker-compose not found; expected ${HOME}/bin/docker-compose" >&2
                exit 1
              fi
            }

            SERVICES="web worker-notifications worker-emails worker-moderation worker-profile-views worker-telegram worker-agreements"

            # Reclaim disk before pulling new images (volumes/DB are preserved).
            docker system prune -af || true
            docker builder prune -af || true

            compose pull $SERVICES
            compose --profile tools run --rm migrate
            compose up -d $SERVICES
            compose ps

  release:
    needs: [deploy, version]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Create and push version tag
        if: needs.version.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="${{ needs.version.outputs.version }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; skipping."
          else
            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
          fi

      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_DEPLOY_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_DEPLOY_CHAT_ID }}
        run: bash scripts/telegram-send.sh release-notes.txt
