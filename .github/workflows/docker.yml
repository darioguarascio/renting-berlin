name: Docker

on:
  push:
    branches: [main, master, dev]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-web:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: darioguarascio/renting.berlin
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  build-workers:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: darioguarascio/renting.berlin-workers
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: ./workers
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=workers
          cache-to: type=gha,mode=max,scope=workers

  deploy:
    needs: [build-web, build-workers]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            export PATH="${HOME}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH:-}"
            export DOCKER_IMAGE_TAG=dev
            cd "${{ secrets.DEPLOY_PATH }}"

            compose() {
              if [ -x "${HOME}/bin/docker-compose" ]; then
                "${HOME}/bin/docker-compose" -f docker-compose.prod.yml "$@"
              elif command -v docker-compose >/dev/null 2>&1; then
                docker-compose -f docker-compose.prod.yml "$@"
              elif docker compose version >/dev/null 2>&1; then
                docker compose -f docker-compose.prod.yml "$@"
              else
                echo "docker-compose not found; expected ${HOME}/bin/docker-compose" >&2
                exit 1
              fi
            }

            if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              git fetch origin dev
              git checkout dev
              git pull --ff-only origin dev
            fi

            SERVICES="web worker-notifications worker-emails worker-moderation worker-profile-views"

            compose pull $SERVICES
            compose --profile tools run --rm migrate
            compose up -d $SERVICES
            compose ps
