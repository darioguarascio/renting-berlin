# Reference copy of production compose on rb.main-0 (/home/app/docker-compose.yml).
# The live file is managed on the server; update this when changing production layout.

x-worker-common: &worker-common
  image: darioguarascio/renting.berlin-workers:${DOCKER_IMAGE_TAG:-dev}
  env_file:
    - .env
  environment:
    METRICS_PORT: "9090"
  restart: unless-stopped

services:
  web:
    image: darioguarascio/renting.berlin:${DOCKER_IMAGE_TAG:-dev}
    ports:
      - "80:4321"
    env_file:
      - .env
    volumes:
      - .data/uploads:/app/apps/web/public/uploads
    restart: unless-stopped
    networks:
      - default
      - app-network

  worker-notifications:
    <<: *worker-common
    ports:
      - "9101:9090"
    command: ["python3", "-m", "renting_berlin_workers", "notifications"]
    networks:
      - default
      - app-network

  worker-emails:
    <<: *worker-common
    ports:
      - "9102:9090"
    command: ["python3", "-m", "renting_berlin_workers", "emails"]
    networks:
      - default
      - app-network

  worker-moderation:
    <<: *worker-common
    ports:
      - "9103:9090"
    environment:
      MODERATION_USE_ML: "1"
      UPLOADS_DIR: /app/uploads
      METRICS_PORT: "9090"
    volumes:
      - .data/uploads:/app/uploads
    command: ["python3", "-m", "renting_berlin_workers", "moderation"]
    networks:
      - default
      - app-network

  worker-profile-views:
    <<: *worker-common
    ports:
      - "9104:9090"
    command: ["python3", "-m", "renting_berlin_workers", "profile-views"]
    networks:
      - default
      - app-network

  worker-telegram:
    <<: *worker-common
    ports:
      - "9105:9090"
    command: ["python3", "-m", "renting_berlin_workers", "telegram"]
    networks:
      - default
      - app-network

  worker-agreements:
    <<: *worker-common
    ports:
      - "9106:9090"
    command: ["python3", "-m", "renting_berlin_workers", "agreements"]
    networks:
      - default
      - app-network

  migrate:
    profiles:
      - tools
    image: darioguarascio/renting.berlin:${DOCKER_IMAGE_TAG:-dev}
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    working_dir: /app/apps/web
    entrypoint: ["./migrate.sh"]
    restart: "no"
    networks:
      - app-network

networks:
  app-network:
    external: true
