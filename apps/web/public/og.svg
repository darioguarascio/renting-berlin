  <!-- logo mark -->
  <rect x="80" y="80" width="64" height="64" rx="16" fill="url(#bldg)"/>
  <text x="112" y="128" text-anchor="middle" fill="white" font-family="Georgia, serif" font-size="36" font-weight="bold">r</text>
  <!-- title -->
  <text x="160" y="108" font-family="system-ui, sans-serif" font-size="52" font-weight="800" fill="#0f1a2e">renting<tspan fill="#2679a3">.</tspan></text>
  <text x="160" y="168" font-family="system-ui, sans-serif" font-size="52" font-weight="800" fill="url(#title)">berlin</text>
  <text x="80" y="230" font-family="system-ui, sans-serif" font-size="28" fill="#5a6b7d">Find your place in Berlin</text>
  <text x="80" y="275" font-family="system-ui, sans-serif" font-size="20" fill="#5a6b7d">Berlin rentals · Trust built in · Map search</text>
  <!-- search card mock -->
  <rect x="80" y="310" width="1040" height="120" rx="20" fill="white" stroke="#d8e3ec" stroke-width="2"/>
  <rect x="110" y="345" width="200" height="14" rx="7" fill="#e8f4fa"/>
  <rect x="110" y="375" width="320" height="14" rx="7" fill="#e8f4fa"/>
