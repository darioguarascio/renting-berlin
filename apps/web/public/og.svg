    <line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="630"/><line x1="160" y1="0" x2="160" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
  </g>
  <!-- skyline -->
  <g fill="url(#bldg)" opacity="0.5">
    <rect x="60" y="420" width="70" height="210"/><rect x="150" y="380" width="55" height="250"/>
    <rect x="220" y="440" width="45" height="190"/><rect x="280" y="360" width="60" height="270"/>
    <path d="M400 630V500l-16-45h32l-16 45v130z"/><path d="M460 630V500l-16-45h32l-16 45v130z"/>
    <rect x="388" y="530" width="84" height="14"/>
