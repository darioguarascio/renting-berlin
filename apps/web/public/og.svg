    <polygon points="548,305 558,375 538,375" fill="#006699"/>
    <rect x="620" y="410" width="65" height="220"/><rect x="700" y="430" width="50" height="200"/>
    <rect x="770" y="370" width="58" height="260"/><rect x="850" y="400" width="72" height="230"/>
    <ellipse cx="920" cy="430" rx="38" ry="22"/><rect x="980" y="390" width="55" height="240"/>
