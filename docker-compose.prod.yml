x-worker-image: &worker-image
  image: darioguarascio/renting.berlin-workers:${DOCKER_IMAGE_TAG:-dev}

# Generic pull-only compose for local/staging. Production uses deploy/docker-compose.server.yml
# (copied manually to rb.main-0 as ~/docker-compose.yml).

x-worker-common: &worker-common
  <<: *worker-image
  env_file:
    - .env
  environment:
    METRICS_PORT: "9090"
  restart: unless-stopped

services:
  web:
    image: darioguarascio/renting.berlin:${DOCKER_IMAGE_TAG:-dev}
    ports:
      - "${APP_PORT:-4321}:4321"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      NODE_ENV: production
    volumes:
      - uploads:/app/apps/web/public/uploads
    restart: unless-stopped

  worker-notifications:
    <<: *worker-common
    ports:
      - "9101:9090"
    command: ["python3", "-m", "renting_berlin_workers", "notifications"]

  worker-emails:
    <<: *worker-common
    ports:
      - "9102:9090"
    command: ["python3", "-m", "renting_berlin_workers", "emails"]

  worker-moderation:
    <<: *worker-common
    ports:
      - "9103:9090"
    environment:
      MODERATION_USE_ML: "1"
      UPLOADS_DIR: /app/uploads
      METRICS_PORT: "9090"
    volumes:
      - uploads:/app/uploads
    command: ["python3", "-m", "renting_berlin_workers", "moderation"]

  worker-profile-views:
    <<: *worker-common
    ports:
      - "9104:9090"
    command: ["python3", "-m", "renting_berlin_workers", "profile-views"]

  worker-telegram:
    <<: *worker-common
    ports:
      - "9105:9090"
    command: ["python3", "-m", "renting_berlin_workers", "telegram"]

  worker-agreements:
    <<: *worker-common
    ports:
      - "9106:9090"
    command: ["python3", "-m", "renting_berlin_workers", "agreements"]

  migrate:
    profiles:
      - tools
    image: darioguarascio/renting.berlin:${DOCKER_IMAGE_TAG:-dev}
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    working_dir: /app/apps/web
    entrypoint: ["./migrate.sh"]
    restart: "no"

volumes:
  uploads:
